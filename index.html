<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#C2698F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Our Wedding" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Our Wedding Planner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:       #C2698F;
      --pink-dark:  #A0446E;
      --pink-light: #F9E8EF;
      --pink-pale:  #FDF0F4;
      --blue:       #6B8FAB;
      --blue-light: #E8F0F6;
      --green:      #5A8A5A;
      --green-bg:   #F0F8F0;
      --red:        #C0392B;
      --red-bg:     #FDECEA;
      --bg:         #FDF6F8;
      --card:       #FFFFFF;
      --text:       #3A2A30;
      --muted:      #9A8890;
      --border:     #F0DCE4;
      --radius:     14px;
      --shadow:     0 2px 12px rgba(194,105,143,0.10);
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    button { font-family: inherit; }

    #app { max-width: 680px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(150deg, #C2698F 0%, #A0446E 55%, #6B8FAB 100%);
      padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px 20px;
      text-align: center; position: relative; overflow: hidden;
    }
    .header-flowers { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .header-flowers span { position: absolute; font-size: 22px; opacity: 0.18; }
    .header-eyebrow { font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,0.75); text-transform: uppercase; margin-bottom: 6px; }
    .header-title {
      font-family: 'Playfair Display', serif; font-size: 26px; color: #fff; font-weight: 400;
      margin-bottom: 16px; text-shadow: 0 1px 6px rgba(0,0,0,0.15);
    }
    .pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .pill { background: rgba(255,255,255,0.2); border-radius: 20px; padding: 5px 13px; color: #fff; font-size: 12px; }
    .pill strong { font-weight: 700; margin-right: 4px; }

    /* ── TABS ── */
    .tabs {
      display: flex; background: #fff; border-bottom: 1.5px solid var(--border);
      position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(194,105,143,0.08);
    }
    .tab-btn {
      flex: 1; padding: 13px 2px; border: none; background: none; cursor: pointer;
      font-size: 12px; color: var(--muted); border-bottom: 2.5px solid transparent;
    }
    .tab-btn.active { font-weight: 700; color: var(--pink); border-bottom-color: var(--pink); }

    /* ── LAYOUT ── */
    .content { padding: 16px 14px 60px; flex: 1; }
    .card { background: var(--card); border-radius: var(--radius); border: 1.5px solid var(--border); box-shadow: var(--shadow); }
    .block { margin-bottom: 14px; }
    .section-label {
      font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--pink);
      display: flex; align-items: center; gap: 5px;
    }
    .section-row { display: flex; justify-content: space-between; align-items: center; margin: 0 2px 8px; }
    .section-count { font-size: 11px; color: var(--muted); }
    .hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 12px; }
    .footer { text-align: center; padding: 18px 0 4px; font-size: 11px; color: var(--muted); }
    .empty { font-size: 13px; color: var(--muted); text-align: center; padding: 14px; }

    /* ── BUTTONS ── */
    .btn {
      flex: 1; border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: 1.5px solid transparent; background: none; min-height: 42px;
    }
    .btn-save, .btn-add { background: linear-gradient(135deg, var(--pink), var(--pink-dark)); color: #fff; }
    .btn-edit { border-color: var(--pink); color: var(--pink); background: #fff; }
    .btn-cancel { border-color: var(--border); color: var(--muted); background: #fff; }
    .btn-del { border-color: var(--border); color: var(--red); background: #fff; flex: 0 0 auto; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn:active { opacity: 0.85; }
    .add-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .add-bar .btn.on { background: #fff; color: var(--pink); border-color: var(--pink); }
    .actions { display: flex; gap: 8px; margin-top: 14px; }

    /* ── ITEM (one pattern for every list) ── */
    .item { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .item + .item { margin-top: 8px; }
    .item.open { border-color: var(--pink); }
    .item.flat { border: none; border-radius: 0; box-shadow: none; border-top: 1px solid var(--border); }
    .item.flat:first-child { border-top: none; }
    .item.flat + .item.flat { margin-top: 0; }
    .item.flat.open { box-shadow: inset 3px 0 0 var(--pink); }
    .item-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; min-height: 52px; cursor: pointer; user-select: none; }
    .item.open .item-head { background: var(--pink-pale); }
    .chev { color: var(--muted); font-size: 18px; line-height: 1; transition: transform 0.15s; flex-shrink: 0; width: 14px; text-align: center; }
    .item.open .chev { transform: rotate(90deg); color: var(--pink); }
    .item-body { padding: 14px; border-top: 1px solid var(--border); }
    .item.editing .item-body { background: #fff; }
    .main { flex: 1; min-width: 0; }
    .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title.serif { font-family: 'Playfair Display', serif; font-weight: 400; font-size: 16px; }
    .sub { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { font-size: 11px; padding: 3px 9px; border-radius: 12px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
    .plus1 { font-size: 10px; background: var(--pink-light); color: var(--pink); border-radius: 6px; padding: 1px 5px; font-weight: 700; margin-left: 4px; vertical-align: 1px; }
    .muted-note { font-style: italic; color: var(--muted); font-weight: 400; }

    /* Read-only details */
    .details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .details .full { grid-column: 1 / -1; }
    .k { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 3px; }
    .v { font-size: 14px; color: var(--text); word-break: break-word; white-space: pre-wrap; }
    .v.empty-v { color: var(--muted); }

    /* Forms */
    .form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form .full { grid-column: 1 / -1; }
    .fld > span { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }
    input, textarea, select {
      font-family: 'Inter', sans-serif; font-size: 15px; color: var(--text);
      border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 12px;
      background: #fff; outline: none; width: 100%;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--pink); }
    input.err, textarea.err { border-color: var(--red); background: var(--red-bg); }
    textarea { resize: vertical; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 7px 13px; border-radius: 20px; font-size: 13px; cursor: pointer;
      border: 1.5px solid var(--border); background: #fff; color: var(--muted);
    }
    .chip.on { font-weight: 700; }
    .chip.on[data-tone=pink]  { border-color: var(--pink);  background: var(--pink-light); color: var(--pink); }
    .chip.on[data-tone=blue]  { border-color: var(--blue);  background: var(--blue-light); color: var(--blue); }
    .chip.on[data-tone=green] { border-color: var(--green); background: var(--green-bg);   color: var(--green); }
    .chip.on[data-tone=muted] { border-color: var(--muted); background: #f5f5f5;           color: var(--text); }

    /* ── CHECKLIST ── */
    .check {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; cursor: pointer;
      border: 2px solid var(--border); background: #fff; color: #fff; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
    }
    .check.done { border-color: var(--pink); background: var(--pink); }
    .task-text.done { text-decoration: line-through; color: var(--muted); font-weight: 400; }
    .item.done-row .item-head { background: var(--green-bg); }
    .add-row { border-top: 1px dashed var(--border); padding: 12px 14px; }
    .add-link { background: none; border: none; color: var(--pink); font-size: 13px; cursor: pointer; padding: 0; }

    /* ── GUESTS ── */
    .summary { display: flex; gap: 8px; margin-bottom: 12px; }
    .summary-pill { flex: 1; border-radius: 12px; padding: 10px 6px; text-align: center; border: 1.5px solid var(--border); cursor: pointer; }
    .summary-pill.active { border-width: 2px; }
    .summary-pill .big { font-size: 22px; font-weight: 700; }
    .summary-pill .small { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .filter-bar {
      display: flex; justify-content: space-between; align-items: center; font-size: 12px;
      background: #fff; border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px;
    }
    .col-head { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin: 16px 2px 8px; }
    .guest-list.drop-hover { background: rgba(194,105,143,0.06); border-radius: var(--radius); }
    .guest-item.dragging { opacity: 0.4; }

    /* ── FINANCE ── */
    .fin-grid { display: grid; grid-template-columns: 1fr 74px 74px 14px; gap: 6px; align-items: center; width: 100%; }
    .fin-head { padding: 9px 14px; background: var(--pink-pale); border-bottom: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; }
    .fin-head span { font-size: 10px; font-weight: 700; color: var(--pink); text-transform: uppercase; letter-spacing: 0.8px; }
    .num { text-align: right; font-size: 13px; white-space: nowrap; }
    .fin-total { padding: 12px 14px; background: var(--pink-pale); border-top: 2px solid var(--border); border-radius: 0 0 var(--radius) var(--radius); }
    .fin-total span { font-weight: 700; font-size: 13px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; text-align: center; }
    .stat-v { font-size: 15px; font-weight: 700; }
    .stat-k { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }
    .bar { background: var(--pink-light); border-radius: 20px; height: 12px; overflow: hidden; margin: 8px 0 12px; }
    .bar > div { height: 100%; border-radius: 20px; background: linear-gradient(90deg, var(--pink), var(--blue)); }
    .bar > div.over { background: var(--red); }

    /* ── OVERLAYS ── */
    .sheet-bg {
      position: fixed; inset: 0; z-index: 300; background: rgba(58,42,48,0.5);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .sheet {
      background: #fff; width: 100%; max-width: 680px; border-radius: 20px 20px 0 0;
      padding: 22px 18px calc(18px + env(safe-area-inset-bottom));
    }
    .sheet-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .sheet-text { font-size: 14px; color: var(--muted); line-height: 1.5; }
    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      background: var(--text); color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 20px;
      z-index: 400; max-width: 90vw; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-flowers" id="headerFlowers"></div>
    <div class="header-eyebrow">✿ Our Wedding ✿</div>
    <div class="header-title" id="headerTitle">Wedding Planner</div>
    <div class="pills" id="headerPills"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="checklist">Checklist</button>
    <button class="tab-btn" data-tab="guests">Guests</button>
    <button class="tab-btn" data-tab="finance">Finance</button>
    <button class="tab-btn" data-tab="venues">Venues</button>
    <button class="tab-btn" data-tab="settings" aria-label="Settings">⚙️</button>
  </div>

  <div class="content" id="content"></div>
</div>

<script>
// ── APP VERSION ── bump both on every push (keep in sync with sw.js CACHE)
const APP_VERSION = 'v41';
const APP_UPDATED = '27 Sep 2026';

// ── DATA ──
const STORE = {
  checklist: 'wp_checklist',
  guests: 'wp_guests',
  budget: 'wp_budget',
  venues: 'wp_venues',
  vendors: 'wp_vendors',
  settings: 'wp_settings',
};

const DEFAULT_CHECKLIST = [
  { id:1, section:"First Things First", task:"Agree guest list and numbers", done:false },
  { id:2, section:"First Things First", task:"Set your budget ceiling", done:false },
  { id:3, section:"First Things First", task:"Visit and shortlist venues", done:false },
  { id:4, section:"First Things First", task:"Book venue — this sets your date", done:false },
  { id:5, section:"First Things First", task:"Give 3 months' legal notice to HSE Register Office", done:false },
  { id:6, section:"First Things First", task:"Choose and book your celebrant", done:false },
  { id:7, section:"Once Venue Is Booked", task:"Send save the dates", done:false },
  { id:8, section:"Once Venue Is Booked", task:"Book photographer", done:false },
  { id:9, section:"Once Venue Is Booked", task:"Sort catering", done:false },
  { id:10, section:"Once Venue Is Booked", task:"Sort guest accommodation", done:false },
  { id:11, section:"Once Venue Is Booked", task:"Choose your outfit", done:false },
  { id:12, section:"Once Venue Is Booked", task:"Book music or arrange playlist", done:false },
  { id:13, section:"A Few Months Out", task:"Send formal invitations", done:false },
  { id:14, section:"A Few Months Out", task:"Confirm dietary requirements", done:false },
  { id:15, section:"A Few Months Out", task:"Arrange wedding rings", done:false },
  { id:16, section:"A Few Months Out", task:"Confirm all suppliers in writing", done:false },
  { id:17, section:"A Few Months Out", task:"Arrange flowers", done:false },
  { id:18, section:"A Few Months Out", task:"Arrange transport if needed", done:false },
  { id:19, section:"Final Few Weeks", task:"Chase outstanding RSVPs", done:false },
  { id:20, section:"Final Few Weeks", task:"Confirm final numbers with venue/caterer", done:false },
  { id:21, section:"Final Few Weeks", task:"Prepare ceremony details with celebrant", done:false },
  { id:22, section:"Final Few Weeks", task:"Confirm photographer schedule", done:false },
  { id:23, section:"Final Few Weeks", task:"Assign a day-of point of contact", done:false },
];

const DEFAULT_BUDGET = [
  { id:1, item:"Venue hire", estimated:"1500", actual:"", notes:"" },
  { id:2, item:"Catering & drinks", estimated:"1200", actual:"", notes:"" },
  { id:3, item:"Celebrant", estimated:"400", actual:"", notes:"" },
  { id:4, item:"Photographer", estimated:"600", actual:"", notes:"" },
  { id:5, item:"Outfit(s)", estimated:"300", actual:"", notes:"" },
  { id:6, item:"Flowers", estimated:"150", actual:"", notes:"" },
  { id:7, item:"Music", estimated:"200", actual:"", notes:"" },
  { id:8, item:"Cake", estimated:"150", actual:"", notes:"" },
  { id:9, item:"Stationery", estimated:"50", actual:"", notes:"" },
  { id:10, item:"Rings", estimated:"300", actual:"", notes:"" },
  { id:11, item:"Miscellaneous", estimated:"150", actual:"", notes:"" },
];

const DEFAULT_VENUES = [
  { id:1, name:"The Old Deanery", location:"Ferns, Co. Wexford", contact:"Bryanna — 087 263 3355", price:"", notes:"Barn, cottages, rural, flexible owner", status:"Enquire" },
  { id:2, name:"Ballinkeele House", location:"Enniscorthy, Co. Wexford", contact:"053 913 8105", price:"", notes:"Georgian house, group accommodation", status:"Enquire" },
  { id:3, name:"Marlfield House", location:"Gorey, Co. Wexford", contact:"Dawn — 053 942 1124", price:"From €145pp", notes:"Luxury hotel, may be over budget", status:"Maybe" },
  { id:4, name:"Wells House & Gardens", location:"Gorey, Co. Wexford", contact:"053 918 6737", price:"", notes:"Victorian estate, worth an enquiry", status:"Enquire" },
];

const DEFAULT_VENDORS = [
  { id:101, name:"", category:"Florist",     contact:"", estimated:"", actual:"", notes:"", status:"Not booked" },
  { id:102, name:"", category:"Catering",    contact:"", estimated:"", actual:"", notes:"", status:"Not booked" },
  { id:103, name:"", category:"Photography", contact:"", estimated:"", actual:"", notes:"", status:"Not booked" },
  { id:104, name:"", category:"Celebrant",   contact:"", estimated:"", actual:"", notes:"", status:"Not booked" },
  { id:105, name:"", category:"Music",       contact:"", estimated:"", actual:"", notes:"", status:"Not booked" },
  { id:106, name:"", category:"Cake",        contact:"", estimated:"", actual:"", notes:"", status:"Not booked" },
];

const VENUE_STATUS = {
  'Booked':    { bg:'#F0F8F0', color:'#5A8A5A', emoji:'✅', order:0 },
  'Maybe':     { bg:'#E8F0F6', color:'#6B8FAB', emoji:'🤔', order:1 },
  'Enquire':   { bg:'#FFF3E0', color:'#E65100', emoji:'📋', order:2 },
  'Ruled out': { bg:'#FFEBEE', color:'#B71C1C', emoji:'✗',  order:3 },
};
const VENDOR_STATUS = {
  'Booked':     { bg:'#F0F8F0', color:'#5A8A5A', emoji:'✅' },
  'Enquiring':  { bg:'#E8F0F6', color:'#6B8FAB', emoji:'📩' },
  'Not booked': { bg:'#FFF3E0', color:'#E65100', emoji:'🔍' },
  'Not needed': { bg:'#f5f5f5', color:'#9A8890', emoji:'—'  },
};

// ── STORAGE ──
function load(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
  catch { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

const state = {
  checklist: load(STORE.checklist, DEFAULT_CHECKLIST),
  guests:    load(STORE.guests, []),
  budget:    load(STORE.budget, DEFAULT_BUDGET),
  venues:    load(STORE.venues, DEFAULT_VENUES),
  vendors:   load(STORE.vendors, DEFAULT_VENDORS),
  settings:  load(STORE.settings, { name1: '', name2: '', ceiling: 10000 }),
};

// UI-only state — never saved.
// open:    'kind:id' of the one card that's open (null = all closed)
// editing: true while the open card is in edit mode
// adding:  kind whose "add" form is showing (null = none)
const ui = { tab: 'checklist', open: null, editing: false, adding: null, addSection: null, guestFilter: null, focus: false };

function saveAll() {
  Object.keys(STORE).forEach(k => save(STORE[k], state[k]));
}

// ── MIGRATION ── older versions kept vendor costs in linked budget lines
// and stored an "expanded" flag on items. Fold both into the new shape.
function migrate() {
  state.vendors.forEach(v => {
    const linked = state.budget.find(b => b.vendorId === v.id);
    if (v.estimated === undefined) v.estimated = (v.price !== undefined && v.price !== '') ? String(v.price) : (linked?.estimated || '');
    if (v.actual === undefined) v.actual = linked?.actual || '';
    ['price','expanded'].forEach(f => delete v[f]);
    ['name','category','contact','notes'].forEach(f => { if (v[f] == null) v[f] = ''; });
    if (!VENDOR_STATUS[v.status]) v.status = 'Not booked';
  });
  const vendorIds = new Set(state.vendors.map(v => v.id));
  state.budget = state.budget.filter(b => !(b.vendorId && vendorIds.has(b.vendorId)));
  state.budget.forEach(b => {
    delete b.vendorId; delete b.expanded;
    if (b.notes == null) b.notes = '';
    // Old estimates like "1,500–2,500": keep the first number
    if (b.estimated && isNaN(Number(b.estimated))) {
      const m = String(b.estimated).replace(/,/g, '').match(/\d+(\.\d+)?/);
      b.estimated = m ? m[0] : '';
    }
  });
  [state.guests, state.venues, state.checklist].forEach(list => list.forEach(x => delete x.expanded));
  state.guests.forEach(g => {
    if (!g.side) g.side = 'Both';
    if (!g.rsvp) g.rsvp = 'Pending';
    g.plusOne = !!g.plusOne;
  });
  saveAll();
}

// ── HELPERS ──
const flowerSVG = (size=16, color='#C2698F', op=0.7) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" style="display:inline-block;vertical-align:middle;opacity:${op}">
    <circle cx="12" cy="12" r="3" fill="${color}"/>
    ${[0,60,120,180,240,300].map(d=>`<ellipse cx="12" cy="5" rx="2.2" ry="3.5" fill="${color}" transform="rotate(${d} 12 12)"/>`).join('')}
  </svg>`;

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const has = v => v !== undefined && v !== null && String(v).trim() !== '';
const eur = n => '€' + n.toLocaleString('en-IE', { maximumFractionDigits: 2 });
const heads = g => g.plusOne ? 2 : 1;
const sumHeads = list => list.reduce((s, g) => s + heads(g), 0);
const newId = () => Date.now() + Math.floor(Math.random() * 1000);
const names = () => ({ bride: state.settings.name1 || 'Bride', groom: state.settings.name2 || 'Groom' });

function isDuplicate(list, field, value, excludeId = null) {
  const v = String(value).toLowerCase().trim();
  return list.some(item => item.id !== excludeId && String(item[field] ?? '').toLowerCase().trim() === v);
}

function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

// Second, explicit approval before anything is deleted.
function confirmDelete(what, extra, onYes) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-title">Delete ${esc(what)}?</div>
      <div class="sheet-text">${extra ? esc(extra) + ' ' : ''}This can't be undone.</div>
      <div class="actions">
        <button class="btn btn-cancel" data-no>Keep it</button>
        <button class="btn btn-danger" data-yes>Delete</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.querySelector('[data-no]').onclick = close;
  bg.querySelector('[data-yes]').onclick = () => { close(); onYes(); };
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
}

// Finance: vendors and manual budget items, one shape
function financeItems() {
  return [
    ...state.vendors.map(v => ({ kind:'vendor', id:v.id, cat: v.category || 'Other', est:num(v.estimated), act:num(v.actual), hasEst:has(v.estimated), hasAct:has(v.actual), raw:v })),
    ...state.budget.map(b => ({ kind:'budget', id:b.id, cat: b.item, est:num(b.estimated), act:num(b.actual), hasEst:has(b.estimated), hasAct:has(b.actual), raw:b })),
  ];
}
function diffInfo(it) {
  if (!it.hasEst || !it.hasAct) return null;
  const d = it.act - it.est;
  if (d > 0) return { sym:'▲', color:'var(--red)',   text:`${eur(d)} over estimate` };
  if (d < 0) return { sym:'▼', color:'var(--green)', text:`${eur(-d)} under estimate` };
  return { sym:'✓', color:'var(--muted)', text:'Exactly on estimate' };
}

// ── BUILDING BLOCKS ──
function chips(field, value, options) {
  return `<div class="chips" data-f="${field}" data-value="${esc(value)}">
    ${options.map(([v, label, tone]) =>
      `<button type="button" class="chip${v===value?' on':''}" data-act="chip" data-v="${esc(v)}" data-tone="${tone}">${esc(label)}</button>`).join('')}
  </div>`;
}
function field(label, f, value, opts = {}) {
  const { full, type = 'text', placeholder = '', area, auto } = opts;
  const attrs = `data-f="${f}" placeholder="${esc(placeholder)}"${auto ? ' data-autofocus' : ''}`;
  const input = area
    ? `<textarea ${attrs} rows="3">${esc(value)}</textarea>`
    : `<input ${attrs} type="${type}" ${type==='number' ? 'inputmode="decimal" min="0" step="any"' : ''} value="${esc(value)}" />`;
  return `<label class="fld${full ? ' full' : ''}"><span>${esc(label)}</span>${input}</label>`;
}
function selectField(label, f, value, options, full) {
  return `<label class="fld${full ? ' full' : ''}"><span>${esc(label)}</span>
    <select data-f="${f}">${options.map(o => `<option value="${esc(o)}"${o===value?' selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
}
function detail(label, value, full) {
  const empty = !has(value);
  return `<div${full ? ' class="full"' : ''}><div class="k">${esc(label)}</div><div class="v${empty?' empty-v':''}">${empty ? '—' : value}</div></div>`;
}
const viewActions = () => `<div class="actions">
    <button class="btn btn-edit" data-act="edit">✎ Edit</button>
    <button class="btn btn-del" data-act="delete">Delete</button>
  </div>`;
const editActions = (isNew, withDelete) => `<div class="actions">
    <button class="btn btn-save" data-act="save">${isNew ? 'Add' : 'Save'}</button>
    <button class="btn btn-cancel" data-act="cancel">Cancel</button>
    ${withDelete ? '<button class="btn btn-del" data-act="delete">Delete</button>' : ''}
  </div>`;

// One card for every list. head = always-visible summary; view/form = body.
function itemCard({ kind, id, head, view, form, flat, extraClass = '', directEdit = false }) {
  const key = `${kind}:${id}`;
  const isNew = id === 'new';
  const open = isNew || ui.open === key;
  const editing = isNew || (open && (ui.editing || directEdit));
  const cls = ['item', flat ? 'flat' : '', open ? 'open' : '', editing ? 'editing' : '', extraClass].filter(Boolean).join(' ');
  let body = '';
  if (open) {
    body = editing
      ? `<div class="item-body"><div class="form">${form}</div>${editActions(isNew, directEdit && !isNew)}</div>`
      : `<div class="item-body"><div class="details">${view}</div>${viewActions()}</div>`;
  }
  return `<div class="${cls}" data-key="${key}">
    ${isNew ? '' : `<div class="item-head" data-act="toggle">${head}<span class="chev">›</span></div>`}
    ${body}
  </div>`;
}

// ── HEADER ──
function renderHeader() {
  document.getElementById('headerFlowers').innerHTML = [[8,8],[88,6],[18,70],[75,65],[45,15],[55,80]]
    .map(([l,t]) => `<span style="left:${l}%;top:${t}%">🌸</span>`).join('');

  const done = state.checklist.filter(t=>t.done).length;
  const confirmed = sumHeads(state.guests.filter(g=>g.rsvp==='Yes'));
  const spent = financeItems().reduce((s,i)=>s+i.act,0);

  const { name1, name2 } = state.settings;
  document.getElementById('headerTitle').innerHTML = (name1 && name2)
    ? `${esc(name1)} <span style="font-size:22px">💍</span> ${esc(name2)}`
    : 'Wedding Planner';

  document.getElementById('headerPills').innerHTML = [
    { v:`${done}/${state.checklist.length}`, l:'tasks done' },
    { v:`${confirmed}/${sumHeads(state.guests)}`, l:'guests confirmed' },
    { v:eur(spent), l:'confirmed spend' },
  ].map(p=>`<div class="pill"><strong>${esc(p.v)}</strong>${esc(p.l)}</div>`).join('');
}

// ── RENDER ──
function render() {
  renderHeader();
  const views = { checklist: renderChecklist, guests: renderGuests, finance: renderFinance, venues: renderVenues, settings: renderSettings };
  const c = document.getElementById('content');
  c.innerHTML = views[ui.tab]() + `<div class="footer">App updated ${APP_UPDATED} · ${APP_VERSION}</div>`;
  if (ui.focus) {
    ui.focus = false;
    const el = c.querySelector('[data-autofocus]') || c.querySelector('.item.editing input, .item.editing textarea');
    if (el) { el.focus(); el.closest('.item')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }
  if (ui.tab === 'guests') initDragDrop();
}

// ── CHECKLIST ──
function taskForm(t, auto) {
  const sections = [...new Set(state.checklist.map(x=>x.section))];
  if (t.section && !sections.includes(t.section)) sections.push(t.section);
  return field('Task', 'task', t.task, { full:true, placeholder:'What needs doing?', auto }) +
         selectField('Section', 'section', t.section, sections, true);
}
function renderChecklist() {
  const sections = [...new Set(state.checklist.map(t=>t.section))];
  const sectionDone = s => state.checklist.filter(t=>t.section===s).every(t=>t.done);
  sections.sort((a,b) => sectionDone(a) - sectionDone(b));

  return sections.map(section => {
    const tasks = state.checklist.filter(t=>t.section===section).sort((a,b) => a.done - b.done);
    const doneCount = tasks.filter(t=>t.done).length;
    const adding = ui.adding === 'task' && ui.addSection === section;
    return `
      <div class="block">
        <div class="section-row">
          <div class="section-label">${flowerSVG(12,'#C2698F',0.8)} ${esc(section)}</div>
          <span class="section-count">${doneCount}/${tasks.length}${doneCount===tasks.length ? ' ✓' : ''}</span>
        </div>
        <div class="card">
          ${tasks.map(t => itemCard({
            kind:'task', id:t.id, flat:true, directEdit:true, extraClass: t.done ? 'done-row' : '',
            head: `<button class="check${t.done?' done':''}" data-act="check" data-id="${t.id}" aria-label="Mark done">${t.done?'✓':''}</button>
                   <div class="main"><div class="title task-text${t.done?' done':''}" style="white-space:normal">${esc(t.task)}</div></div>`,
            form: taskForm(t),
          })).join('')}
          ${adding
            ? itemCard({ kind:'task', id:'new', flat:true, form: taskForm({ task:'', section }, true) })
            : `<div class="add-row"><button class="add-link" data-act="add" data-kind="task" data-section="${esc(section)}">+ Add a task</button></div>`}
        </div>
      </div>`;
  }).join('') + `<div class="hint">Tap the circle to tick off · tap a task to edit it</div>`;
}

// ── GUESTS ──
const RSVP_OPTS = [['Yes','Coming','green'], ['Pending','Pending','pink'], ['No',"Can't make it",'muted']];
function guestForm(g, auto) {
  const { bride, groom } = names();
  return field('Name', 'name', g.name, { full:true, placeholder:'Guest name', auto }) +
    `<div class="fld full"><span>RSVP</span>${chips('rsvp', g.rsvp || 'Pending', RSVP_OPTS)}</div>` +
    `<div class="fld full"><span>Side</span>${chips('side', g.side || 'Both', [['Bride',bride,'pink'],['Groom',groom,'blue'],['Both','Both','green']])}</div>` +
    `<div class="fld full"><span>Plus one</span>${chips('plusOne', g.plusOne ? 'yes' : 'no', [['no','Just them','pink'],['yes','Bringing a +1','pink']])}</div>` +
    field('Dietary requirements', 'dietary', g.dietary, { full:true, placeholder:'e.g. vegetarian, nut allergy' }) +
    field('Notes', 'notes', g.notes, { full:true, area:true, placeholder:'Anything to remember' });
}
function guestCard(g) {
  const { bride, groom } = names();
  const rsvp = RSVP_OPTS.find(o=>o[0]===g.rsvp) || RSVP_OPTS[1];
  const tone = { green:['var(--green-bg)','var(--green)'], pink:['var(--pink-light)','var(--pink)'], muted:['#f3f3f3','var(--muted)'] }[rsvp[2]];
  const extras = [g.dietary && '🍽 ' + g.dietary, g.notes && '📝'].filter(Boolean).join(' · ');
  return itemCard({
    kind:'guest', id:g.id, extraClass:'guest-item',
    head: `<div class="main">
             <div class="title">${esc(g.name)}${g.plusOne ? '<span class="plus1">+1</span>' : ''}</div>
             ${extras ? `<div class="sub">${esc(extras)}</div>` : ''}
           </div>
           <span class="badge" style="background:${tone[0]};color:${tone[1]}">${esc(rsvp[1])}</span>`,
    view: detail('RSVP', esc(rsvp[1])) +
          detail('Side', esc(g.side==='Bride' ? bride : g.side==='Groom' ? groom : 'Both')) +
          detail('Plus one', g.plusOne ? 'Yes — counts as 2' : 'No') +
          detail('Dietary', esc(g.dietary)) +
          detail('Notes', esc(g.notes), true),
    form: guestForm(g),
  });
}
function renderGuests() {
  const { bride, groom } = names();
  const counts = { Yes:0, Pending:0, No:0 };
  state.guests.forEach(g => counts[g.rsvp] = (counts[g.rsvp]||0) + heads(g));
  const f = ui.guestFilter;
  const shown = f ? state.guests.filter(g => g.rsvp === f) : state.guests;
  const bySide = side => shown.filter(g => (g.side||'Both') === side);
  const all = side => state.guests.filter(g => (g.side||'Both') === side);
  const bCount = sumHeads(all('Bride')), gCount = sumHeads(all('Groom')), bothCount = sumHeads(all('Both'));
  const total = bCount + gCount + bothCount;
  const bPct = total ? Math.round(bCount/total*100) : 0;
  const gPct = total ? Math.round(gCount/total*100) : 0;

  const group = (side, label, color) => {
    const list = bySide(side);
    if (side === 'Both' && !all('Both').length) return '';
    return `<div class="col-head" style="color:${color}">${esc(label)} · ${sumHeads(list)}</div>
      <div class="guest-list" data-col="${side}">
        ${list.length ? list.map(guestCard).join('') : `<div class="empty">${f ? 'Nobody here with that RSVP' : 'None yet'}</div>`}
      </div>`;
  };

  return `
    <div class="summary">
      ${[['Yes','#F0F8F0','#5A8A5A','Coming 💚'],['Pending','#FDF0F4','#C2698F','Pending 🌸'],['No','#f5f5f5','#9A8890',"Can't make it"]].map(([r,bg,col,label]) => `
        <div class="summary-pill${f===r?' active':''}" style="background:${bg};${f===r?`border-color:${col}`:''}" data-act="filter" data-v="${r}">
          <div class="big" style="color:${col}">${counts[r]||0}</div>
          <div class="small">${label}</div>
        </div>`).join('')}
    </div>
    ${f ? `<div class="filter-bar"><span>Showing <b>${f==='Yes'?'Coming':f==='No'?"Can't make it":'Pending'}</b> only</span><button class="add-link" data-act="filter" data-v="${f}">Show all</button></div>` : ''}

    <div class="card block" style="padding:14px">
      <div style="display:flex;justify-content:space-between;align-items:flex-end">
        <div><div style="font-size:18px;font-weight:700;color:var(--pink)">${bCount}</div><div style="font-size:11px;color:var(--muted)">${esc(bride)}</div></div>
        <div style="font-size:11px;color:var(--muted);text-align:center">${total} people incl. +1s${bothCount ? `<br>${bothCount} shared` : ''}</div>
        <div style="text-align:right"><div style="font-size:18px;font-weight:700;color:var(--blue)">${gCount}</div><div style="font-size:11px;color:var(--muted)">${esc(groom)}</div></div>
      </div>
      <div style="display:flex;border-radius:20px;overflow:hidden;height:8px;background:var(--border);margin-top:10px">
        <div style="width:${bPct}%;background:var(--pink)"></div>
        <div style="width:${100-bPct-gPct}%;background:#D9CDD3"></div>
        <div style="width:${gPct}%;background:var(--blue)"></div>
      </div>
    </div>

    <div class="add-bar">
      <button class="btn btn-add${ui.adding==='guest'?' on':''}" data-act="add" data-kind="guest">${ui.adding==='guest' ? '× Close' : '+ Add guest'}</button>
    </div>
    ${ui.adding==='guest' ? `<div class="block">${itemCard({ kind:'guest', id:'new', form: guestForm({ rsvp:'Pending', side:'Both' }, true) })}</div>` : ''}

    ${state.guests.length === 0
      ? `<div class="empty">${flowerSVG(28,'#C2698F',0.4)}<br>No guests yet — tap “Add guest” to start</div>`
      : group('Bride', bride, 'var(--pink)') + group('Groom', groom, 'var(--blue)') + group('Both', 'Both sides', 'var(--muted)')}
    <div class="hint">Tap a guest to open · long-press to move between sides</div>`;
}

// ── FINANCE ──
function vendorForm(v, auto) {
  return field('Category', 'category', v.category, { placeholder:'e.g. Florist', auto }) +
    selectField('Status', 'status', v.status || 'Not booked', Object.keys(VENDOR_STATUS)) +
    field('Vendor name', 'name', v.name, { full:true, placeholder:'e.g. Jane Murphy Photography' }) +
    field('Contact', 'contact', v.contact, { full:true, placeholder:'Phone or email' }) +
    field('Estimated (€)', 'estimated', v.estimated, { type:'number', placeholder:'0' }) +
    field('Confirmed (€)', 'actual', v.actual, { type:'number', placeholder:'0' }) +
    field('Notes', 'notes', v.notes, { full:true, area:true, placeholder:'Quotes, what’s included, deposits…' });
}
function budgetForm(b, auto) {
  return field('Item name', 'item', b.item, { full:true, placeholder:'e.g. Transport', auto }) +
    field('Estimated (€)', 'estimated', b.estimated, { type:'number', placeholder:'0' }) +
    field('Confirmed (€)', 'actual', b.actual, { type:'number', placeholder:'0' }) +
    field('Notes', 'notes', b.notes, { full:true, area:true, placeholder:'Optional' });
}
function financeRow(it) {
  const d = diffInfo(it);
  const numbers = `
    <span class="num" style="color:var(--blue);font-weight:600">${d ? `<span style="color:${d.color};font-size:10px">${d.sym}</span> ` : ''}${it.hasEst ? eur(it.est) : '—'}</span>
    <span class="num" style="${it.hasAct ? 'color:var(--green);font-weight:700' : 'color:var(--muted)'}">${it.hasAct ? eur(it.act) : '—'}</span>`;
  if (it.kind === 'vendor') {
    const v = it.raw, s = VENDOR_STATUS[v.status];
    return itemCard({
      kind:'vendor', id:v.id, flat:true,
      head: `<div class="fin-grid">
               <div class="main">
                 <div class="sub" style="margin:0 0 2px">${s.emoji} ${esc(v.category || 'Other')}</div>
                 <div class="title">${v.name ? esc(v.name) : '<span class="muted-note">Not chosen yet</span>'}</div>
               </div>${numbers}</div>`,
      view: detail('Status', `<span class="badge" style="background:${s.bg};color:${s.color}">${s.emoji} ${esc(v.status)}</span>`) +
            detail('Contact', esc(v.contact)) +
            detail('Estimated', it.hasEst ? eur(it.est) : '') +
            detail('Confirmed', it.hasAct ? eur(it.act) : '') +
            (d ? detail('Difference', `<span style="color:${d.color}">${d.sym} ${d.text}</span>`, true) : '') +
            detail('Notes', esc(v.notes), true),
      form: vendorForm(v),
    });
  }
  const b = it.raw;
  return itemCard({
    kind:'budget', id:b.id, flat:true,
    head: `<div class="fin-grid">
             <div class="main"><div class="sub" style="margin:0 0 2px">Budget item</div><div class="title">${esc(b.item)}</div></div>${numbers}</div>`,
    view: detail('Estimated', it.hasEst ? eur(it.est) : '') +
          detail('Confirmed', it.hasAct ? eur(it.act) : '') +
          (d ? detail('Difference', `<span style="color:${d.color}">${d.sym} ${d.text}</span>`, true) : '') +
          detail('Notes', esc(b.notes), true),
    form: budgetForm(b),
  });
}
function renderFinance() {
  const CEILING = num(state.settings.ceiling) || 10000;
  const items = financeItems();
  const spent = items.reduce((s,i)=>s+i.act,0);
  const estimated = items.reduce((s,i)=>s+i.est,0);
  // Projected = confirmed where known, otherwise the estimate
  const projected = items.reduce((s,i)=>s+(i.hasAct ? i.act : i.est),0);
  const pct = Math.min(spent/CEILING*100, 100);
  const over = spent > CEILING;
  const projOver = projected - CEILING;

  const cats = {};
  items.forEach(i => { if (i.act) cats[i.cat] = (cats[i.cat]||0) + i.act; });
  const catEntries = Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const colors = ['#C2698F','#6B8FAB','#5A8A5A','#E65100','#7B61FF','#E91E8C','#00897B','#F4A320'];
  const donut = () => {
    const r=54, cx=70, cy=70, circ=2*Math.PI*r; let off=0;
    return `<svg width="140" height="140" viewBox="0 0 140 140">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="22"/>
      ${catEntries.map(([,val],i)=>{ const d=val/spent*circ; const s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="22" stroke-dasharray="${d} ${circ-d}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`; off+=d; return s; }).join('')}
      <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">${spent>=1000 ? '€'+(spent/1000).toFixed(1)+'k' : eur(spent)}</text>
      <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="9" fill="var(--muted)">confirmed</text>
    </svg>`;
  };

  const sorted = items.sort((a,b) => {
    if (a.hasAct !== b.hasAct) return a.hasAct ? -1 : 1;
    return a.hasAct ? b.act - a.act : b.est - a.est;
  });

  const addOpen = ui.adding === 'vendor' || ui.adding === 'budget';
  return `
    <div class="add-bar">
      <button class="btn btn-add${ui.adding==='vendor'?' on':''}" data-act="add" data-kind="vendor">${ui.adding==='vendor' ? '× Close' : '+ Add vendor'}</button>
      <button class="btn btn-add${ui.adding==='budget'?' on':''}" data-act="add" data-kind="budget">${ui.adding==='budget' ? '× Close' : '+ Add budget item'}</button>
    </div>
    ${addOpen ? `<div class="block">${ui.adding==='vendor'
        ? itemCard({ kind:'vendor', id:'new', form: vendorForm({ status:'Not booked' }, true) })
        : itemCard({ kind:'budget', id:'new', form: budgetForm({}, true) })}</div>` : ''}

    <div class="card block" style="padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:13px;font-weight:700">${eur(spent)} <span style="font-size:11px;font-weight:400;color:var(--muted)">confirmed of ${eur(CEILING)}</span></span>
        <span style="font-size:12px;font-weight:700;color:${over?'var(--red)':'var(--green)'}">${Math.round(spent/CEILING*100)}% used</span>
      </div>
      <div class="bar"><div class="${over?'over':''}" style="width:${pct}%"></div></div>
      <div class="stats">
        <div><div class="stat-v" style="color:var(--pink)">${eur(spent)}</div><div class="stat-k">Confirmed</div></div>
        <div><div class="stat-v" style="color:var(--blue)">${eur(estimated)}</div><div class="stat-k">Estimated</div></div>
        <div><div class="stat-v" style="color:${over?'var(--red)':'var(--green)'}">${eur(Math.abs(CEILING-spent))}</div><div class="stat-k">${over?'Over budget':'Remaining'}</div></div>
      </div>
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);text-align:center">
        Projected total <b style="color:var(--text)">${eur(projected)}</b>
        <span style="color:${projOver>0?'var(--red)':'var(--green)'}"> · ${projOver>0 ? `${eur(projOver)} over` : `${eur(-projOver)} under`} budget</span><br>
        <span style="font-size:11px">confirmed costs + estimates for anything not yet confirmed</span>
      </div>
    </div>

    ${catEntries.length ? `
    <div class="card block" style="padding:14px">
      <div class="section-label" style="margin-bottom:12px">${flowerSVG(11,'#C2698F',0.8)} Where the money goes</div>
      <div style="display:flex;align-items:center;gap:16px">
        <div style="flex-shrink:0">${donut()}</div>
        <div style="flex:1;min-width:0">
          ${catEntries.slice(0,5).map(([cat,val],i)=>`
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:7px">
              <div style="width:9px;height:9px;border-radius:50%;flex-shrink:0;background:${colors[i%colors.length]}"></div>
              <span style="font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(cat)}</span>
              <span style="font-size:12px;font-weight:600">${eur(val)}</span>
            </div>`).join('')}
          ${catEntries.length>5 ? `<div style="font-size:11px;color:var(--muted)">+${catEntries.length-5} more</div>` : ''}
        </div>
      </div>
    </div>` : ''}

    <div class="section-row"><div class="section-label">${flowerSVG(11,'#C2698F',0.8)} All items</div><span class="section-count">${items.length}</span></div>
    <div class="card">
      <div class="fin-head fin-grid"><span>Item</span><span class="num">Est.</span><span class="num">Actual</span><span></span></div>
      ${sorted.map(financeRow).join('') || '<div class="empty">Nothing here yet</div>'}
      <div class="fin-total fin-grid">
        <span style="color:var(--pink-dark)">Total</span>
        <span class="num" style="color:var(--blue)">${eur(estimated)}</span>
        <span class="num" style="color:var(--pink-dark)">${eur(spent)}</span><span></span>
      </div>
    </div>
    <div class="hint">▲ over estimate · ▼ under estimate · tap a row to open</div>`;
}

// ── VENUES ──
function venueForm(v, auto) {
  return field('Venue name', 'name', v.name, { full:true, placeholder:'Venue name', auto }) +
    field('Location', 'location', v.location, { full:true, placeholder:'Town, county' }) +
    field('Contact', 'contact', v.contact, { full:true, placeholder:'Name, phone or email' }) +
    field('Price quoted', 'price', v.price, { placeholder:'e.g. €2,000 or €45pp' }) +
    selectField('Status', 'status', v.status || 'Enquire', Object.keys(VENUE_STATUS)) +
    field('Notes', 'notes', v.notes, { full:true, area:true, placeholder:'Impressions, capacity, what’s included…' });
}
function renderVenues() {
  const sorted = [...state.venues].sort((a,b) => (VENUE_STATUS[a.status]?.order ?? 9) - (VENUE_STATUS[b.status]?.order ?? 9));
  return `
    <div class="add-bar">
      <button class="btn btn-add${ui.adding==='venue'?' on':''}" data-act="add" data-kind="venue">${ui.adding==='venue' ? '× Close' : '+ Add venue'}</button>
    </div>
    ${ui.adding==='venue' ? `<div class="block">${itemCard({ kind:'venue', id:'new', form: venueForm({ status:'Enquire' }, true) })}</div>` : ''}
    ${sorted.length ? sorted.map(v => {
      const s = VENUE_STATUS[v.status] || VENUE_STATUS['Enquire'];
      return itemCard({
        kind:'venue', id:v.id,
        head: `<div class="main">
                 <div class="title serif">${esc(v.name)}</div>
                 <div class="sub">📍 ${esc(v.location || 'No location')}${v.price ? ' · ' + esc(v.price) : ''}</div>
               </div>
               <span class="badge" style="background:${s.bg};color:${s.color}">${s.emoji} ${esc(v.status)}</span>`,
        view: detail('Price quoted', esc(v.price)) +
              detail('Status', esc(v.status)) +
              detail('Contact', esc(v.contact), true) +
              detail('Notes', esc(v.notes), true),
        form: venueForm(v),
      });
    }).join('') : '<div class="empty">No venues yet</div>'}
    <div class="hint">Booked venues show first · tap a venue to open</div>`;
}

// ── SETTINGS ──
function renderSettings() {
  const { name1, name2, ceiling } = state.settings;
  return `
    <div class="card block" style="padding:18px">
      <div class="section-label" style="margin-bottom:12px">${flowerSVG(12,'#C2698F',0.8)} Names in header</div>
      <div class="form">
        <label class="fld"><span>Person 1</span><input id="settingsName1" placeholder="First name" value="${esc(name1)}" /></label>
        <label class="fld"><span>Person 2</span><input id="settingsName2" placeholder="First name" value="${esc(name2)}" /></label>
      </div>
      <div class="actions"><button class="btn btn-save" data-act="save-names">Save names</button></div>
    </div>
    <div class="card" style="padding:18px">
      <div class="section-label" style="margin-bottom:12px">${flowerSVG(12,'#C2698F',0.8)} Budget ceiling</div>
      <label class="fld"><span>Total budget (€)</span><input id="settingsCeiling" type="number" inputmode="decimal" placeholder="10000" value="${esc(ceiling || 10000)}" /></label>
      <div class="actions"><button class="btn btn-save" data-act="save-ceiling">Save budget</button></div>
    </div>`;
}

// ── SAVE / DELETE PER KIND ──
function readForm(root) {
  const o = {};
  root.querySelectorAll('[data-f]').forEach(el => {
    o[el.dataset.f] = el.classList.contains('chips') ? el.dataset.value : el.value.trim();
  });
  return o;
}
function fail(root, f, msg) {
  const el = root.querySelector(`[data-f="${f}"]`);
  if (el) { el.classList.add('err'); el.focus(); el.addEventListener('input', () => el.classList.remove('err'), { once:true }); }
  toast(msg);
  return false;
}
const LISTS = { task:'checklist', guest:'guests', vendor:'vendors', budget:'budget', venue:'venues' };

function saveItem(kind, id, root) {
  const f = readForm(root);
  const list = state[LISTS[kind]];
  const isNew = id === 'new';
  const existing = isNew ? {} : list.find(x => x.id === id);
  const exclude = isNew ? null : id;
  if (['estimated','actual'].some(k => f[k] !== undefined && f[k] !== '' && isNaN(Number(f[k]))))
    return fail(root, isNaN(Number(f.estimated)) ? 'estimated' : 'actual', 'Please enter numbers only for amounts');

  let data;
  if (kind === 'task') {
    if (!f.task) return fail(root, 'task', 'Please enter the task');
    if (isDuplicate(list, 'task', f.task, exclude)) return fail(root, 'task', 'That task is already on the list');
    data = { task: f.task, section: f.section };
  } else if (kind === 'guest') {
    if (!f.name) return fail(root, 'name', 'Please enter a name');
    if (isDuplicate(list, 'name', f.name, exclude)) return fail(root, 'name', `“${f.name}” is already on the list`);
    data = { name: f.name, rsvp: f.rsvp, side: f.side, plusOne: f.plusOne === 'yes', dietary: f.dietary, notes: f.notes };
  } else if (kind === 'vendor') {
    if (!f.category && !f.name) return fail(root, 'category', 'Please enter a category or name');
    if (f.name && isDuplicate(list, 'name', f.name, exclude)) return fail(root, 'name', `“${f.name}” already exists`);
    data = { ...f, category: f.category || 'Other' };
  } else if (kind === 'budget') {
    if (!f.item) return fail(root, 'item', 'Please enter an item name');
    if (isDuplicate(list, 'item', f.item, exclude)) return fail(root, 'item', `“${f.item}” already exists`);
    data = f;
  } else if (kind === 'venue') {
    if (!f.name) return fail(root, 'name', 'Please enter the venue name');
    if (isDuplicate(list, 'name', f.name, exclude)) return fail(root, 'name', `“${f.name}” already exists`);
    data = f;
  }

  if (isNew) list.push({ id: newId(), ...(kind === 'task' ? { done:false } : {}), ...data });
  else Object.assign(existing, data);
  saveAll();
  return true;
}

function itemLabel(kind, x) {
  if (kind === 'task') return 'this task';
  if (kind === 'vendor') return x.name ? `“${x.name}”` : `the ${x.category} vendor`;
  if (kind === 'budget') return `“${x.item}”`;
  return `“${x.name}”`;
}

// ── EVENTS (delegated once — survive every re-render) ──
function busyWith(key) {
  // Protect unsaved edits: something else is being edited/added
  if (ui.adding) return !key || key !== `${ui.adding}:new`;
  return ui.editing && ui.open && ui.open !== key;
}
function blockIfBusy(key) {
  if (busyWith(key)) { toast('Save or cancel your changes first'); return true; }
  return false;
}

let suppressClick = false;
function onClick(e) {
  if (suppressClick) { suppressClick = false; return; }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const root = btn.closest('[data-key]');
  const [kind, rawId] = root ? root.dataset.key.split(':') : [];
  const id = rawId === 'new' ? 'new' : Number(rawId);
  const key = root?.dataset.key;

  switch (act) {
    case 'toggle': {
      if (ui.open === key && ui.editing && kind !== 'task') { toast('Save or cancel your changes first'); return; }
      if (blockIfBusy(key)) return;
      ui.open = ui.open === key ? null : key;
      ui.editing = !!ui.open && kind === 'task';
      ui.focus = ui.editing;
      break;
    }
    case 'check': {
      e.stopPropagation();
      if (blockIfBusy(null)) return;
      const t = state.checklist.find(x => x.id === Number(btn.dataset.id));
      if (!t) return;
      t.done = !t.done; saveAll();
      if (ui.open === `task:${t.id}`) { ui.open = null; ui.editing = false; }
      break;
    }
    case 'chip': {
      const group = btn.closest('.chips');
      group.dataset.value = btn.dataset.v;
      group.querySelectorAll('.chip').forEach(ch => ch.classList.toggle('on', ch === btn));
      return; // no re-render: keep what's typed
    }
    case 'edit':
      ui.editing = true; ui.focus = true;
      break;
    case 'cancel':
      if (id === 'new') ui.adding = null;
      else { ui.editing = false; if (kind === 'task') ui.open = null; }
      break;
    case 'save':
      if (!saveItem(kind, id, root)) return;
      toast(id === 'new' ? 'Added ✓' : 'Saved ✓');
      if (id === 'new') ui.adding = null;
      ui.editing = false;
      if (kind === 'task') ui.open = null;
      break;
    case 'delete': {
      const list = state[LISTS[kind]];
      const item = list.find(x => x.id === id);
      if (!item) return;
      confirmDelete(itemLabel(kind, item), kind === 'guest' && item.plusOne ? 'Their +1 goes too.' : '', () => {
        state[LISTS[kind]] = list.filter(x => x.id !== id);
        ui.open = null; ui.editing = false;
        saveAll(); render(); toast('Deleted');
      });
      return;
    }
    case 'add': {
      const k = btn.dataset.kind;
      const sameForm = ui.adding === k && (k !== 'task' || ui.addSection === btn.dataset.section);
      if (sameForm) { ui.adding = null; break; }
      if (ui.adding || ui.editing) { toast('Save or cancel your changes first'); return; }
      ui.adding = k; ui.addSection = btn.dataset.section || null;
      ui.open = null; ui.focus = true;
      break;
    }
    case 'filter':
      ui.guestFilter = ui.guestFilter === btn.dataset.v ? null : btn.dataset.v;
      break;
    case 'save-names':
      state.settings.name1 = document.getElementById('settingsName1').value.trim();
      state.settings.name2 = document.getElementById('settingsName2').value.trim();
      saveAll(); toast('Names saved ✓');
      break;
    case 'save-ceiling': {
      const val = parseFloat(document.getElementById('settingsCeiling').value);
      if (!(val > 0)) { toast('Please enter a budget above €0'); return; }
      state.settings.ceiling = val; saveAll(); toast('Budget saved ✓');
      break;
    }
    default: return;
  }
  render();
}

function onKeyDown(e) {
  // Enter in a single-line field saves the card
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  const saveBtn = e.target.closest('.item')?.querySelector('[data-act="save"]');
  if (saveBtn) { e.preventDefault(); saveBtn.click(); }
}

function initTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.tab === ui.tab) return;
      if (ui.editing || ui.adding) { toast('Save or cancel your changes first'); return; }
      ui.tab = btn.dataset.tab; ui.open = null;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      window.scrollTo({ top: 0 });
      render();
    });
  });
}

// ── TOUCH DRAG AND DROP (guests between sides) ──
function initDragDrop() {
  document.querySelectorAll('.guest-item').forEach(card => {
    const head = card.querySelector('.item-head');
    if (!head) return;
    const id = Number(card.dataset.key.split(':')[1]);
    let timer, ghost = null, startX = 0, startY = 0;

    const cleanup = () => {
      clearTimeout(timer);
      ghost?.remove(); ghost = null;
      card.classList.remove('dragging');
      document.querySelectorAll('.guest-list').forEach(l => l.classList.remove('drop-hover'));
    };

    head.addEventListener('touchstart', e => {
      if (ui.editing || ui.adding || card.classList.contains('open')) return;
      const t = e.touches[0]; startX = t.clientX; startY = t.clientY;
      timer = setTimeout(() => {
        card.classList.add('dragging');
        ghost = card.cloneNode(true);
        ghost.style.cssText = `position:fixed;z-index:999;pointer-events:none;width:${card.offsetWidth}px;opacity:0.9;border-color:var(--pink);left:${card.getBoundingClientRect().left}px;top:${t.clientY-26}px`;
        document.body.appendChild(ghost);
        if (navigator.vibrate) navigator.vibrate(30);
      }, 450);
    }, { passive: true });

    head.addEventListener('touchmove', e => {
      const t = e.touches[0];
      if (!ghost) {
        if (Math.abs(t.clientX-startX) > 8 || Math.abs(t.clientY-startY) > 8) clearTimeout(timer);
        return;
      }
      e.preventDefault();
      ghost.style.top = (t.clientY - 26) + 'px';
      const list = document.elementFromPoint(t.clientX, t.clientY)?.closest('.guest-list');
      document.querySelectorAll('.guest-list').forEach(l => l.classList.toggle('drop-hover', l === list));
    }, { passive: false });

    head.addEventListener('touchend', e => {
      if (!ghost) { clearTimeout(timer); return; }
      const t = e.changedTouches[0];
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const list = el?.closest('.guest-list');
      const targetCard = el?.closest('.guest-item');
      const g = state.guests.find(x => x.id === id);
      cleanup();
      suppressClick = true; setTimeout(() => { suppressClick = false; }, 400);
      if (!g) return;
      if (list) g.side = list.dataset.col;
      if (targetCard && targetCard !== card) {
        const toId = Number(targetCard.dataset.key.split(':')[1]);
        const from = state.guests.findIndex(x => x.id === id);
        const [moved] = state.guests.splice(from, 1);
        state.guests.splice(state.guests.findIndex(x => x.id === toId), 0, moved);
      }
      saveAll(); render();
    });
    head.addEventListener('touchcancel', cleanup);
  });
}

// ── SERVICE WORKER ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ── INIT ──
migrate();
initTabs();
document.getElementById('content').addEventListener('click', onClick);
document.getElementById('content').addEventListener('keydown', onKeyDown);
render();
</script>
</body>
</html>
